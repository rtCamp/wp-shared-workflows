name: Deploy to S3

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    uses: rtCamp/wp-shared-workflows/.github/workflows/ci-build.yml@v1
    with:
      working-dir: plugins/acme-crm
      install-composer-deps: true
      build-command: npm run build:prod && npm run package
      upload-artifact: true
      artifact-name: acme-crm
      artifact-path: dist/acme-crm.zip

  deploy:
    needs: build
    uses: rtCamp/wp-shared-workflows/.github/workflows/cd-s3.yml@v1
    with:
      tag: ${{ github.ref_name }}
      artifact-name: acme-crm
      bucket: acme-plugin-releases
      prefix: acme-crm/
      region: ap-south-1
      cloudfront-distribution-id: E1ACMEDISTRIBUTION
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
