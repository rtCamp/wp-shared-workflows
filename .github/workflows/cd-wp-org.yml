name: CD / WordPress.org Deploy

on:
  workflow_call:
    inputs:
      slug:
        description: "Plugin slug on wordpress.org (the directory under plugins.svn.wordpress.org)."
        type: string
        required: true
      tag:
        description: "Release tag, e.g. v1.2.3. A leading 'v' is stripped; the result must match readme.txt's Stable tag and becomes the SVN tags/<version>."
        type: string
        required: true
      artifact-name:
        description: "Name of the build artifact to download and deploy. Must match the name used by the producing job (e.g. ci-build.yml's artifact-name)."
        type: string
        required: true
      assets-path:
        description: "Local directory (in the checked-out repo) mapped to SVN /assets/. Skipped if it does not exist."
        type: string
        default: ".wordpress-org"
      dry-run:
        description: "Run the full deploy except the final SVN commit."
        type: boolean
        default: false
      working-dir:
        description: >-
          Directory the project lives in, relative to the repo root. A path prefix, not a working
          directory: it prefixes assets-path only. The deployed files come from the artifact,
          already scoped by its build.
        type: string
        default: "."
    secrets:
      WP_ORG_USERNAME:
        description: "WordPress.org account username with commit access to the plugin."
        required: true
      WP_ORG_PASSWORD:
        description: "WordPress.org account password."
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      # Needed so the 10up action can read assets-path from the workspace; the
      # plugin files themselves come from the downloaded artifact (BUILD_DIR).
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: ${{ inputs.artifact-name }}
          path: artifact

      - name: Verify readme.txt stable tag matches the release tag
        id: check
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          if [ ! -f artifact/readme.txt ]; then
            echo "::error::artifact/readme.txt not found in downloaded artifact '$ARTIFACT_NAME'"
            exit 1
          fi
          expected="${TAG#v}"
          stable="$(awk -F':' 'tolower($1) ~ /^[[:space:]]*stable tag[[:space:]]*$/ {sub(/^[^:]*:/, "", $0); gsub(/[[:space:]]/, "", $0); print; exit}' artifact/readme.txt)"
          if [ -z "$stable" ]; then
            echo "::error::No 'Stable tag:' header found in artifact/readme.txt"
            exit 1
          fi
          if [ "$stable" != "$expected" ]; then
            echo "::error::readme.txt Stable tag ($stable) does not match release tag ($expected)"
            exit 1
          fi
          echo "version=$expected" >> "$GITHUB_OUTPUT"

      # The 10up action errors if ASSETS_DIR points at a missing directory; it
      # only skips assets when ASSETS_DIR is empty. Resolve to empty when the
      # path is absent so repos without an assets dir deploy without failing.
      - name: Resolve assets directory
        id: assets
        shell: bash
        env:
          ASSETS_PATH: ${{ inputs.assets-path }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail

          # working-dir is a path prefix, not a cwd: only assets-path is read from the source.
          dir="${WORKING_DIR:-.}"; dir="${dir#./}"; dir="${dir%/}"; [ -n "$dir" ] || dir="."
          # Reject traversal — this is synced to the plugin's PUBLIC wordpress.org /assets/.
          case "$dir" in
            /*)   echo "::error::working-dir must be relative to the repo root (got '$WORKING_DIR')"; exit 1 ;;
            *..*) echo "::error::working-dir must not contain '..' (got '$WORKING_DIR')"; exit 1 ;;
          esac
          case "$ASSETS_PATH" in
            /*)   echo "::error::assets-path must be relative to working-dir (got '$ASSETS_PATH')"; exit 1 ;;
            *..*) echo "::error::assets-path must not contain '..' (got '$ASSETS_PATH')"; exit 1 ;;
          esac
          if [ -n "$ASSETS_PATH" ] && [ "$dir" != "." ]; then
            ASSETS_PATH="${dir}/${ASSETS_PATH#./}"
          fi

          if [ -n "$ASSETS_PATH" ] && [ -d "$ASSETS_PATH" ]; then
            echo "assets_dir=$ASSETS_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::assets-path '$ASSETS_PATH' not found; skipping assets sync"
            echo "assets_dir=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2  # v2.3.0
        timeout-minutes: 15
        with:
          dry-run: ${{ inputs.dry-run }}
        env:
          SVN_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}
          SLUG: ${{ inputs.slug }}
          VERSION: ${{ steps.check.outputs.version }}
          ASSETS_DIR: ${{ steps.assets.outputs.assets_dir }}
          BUILD_DIR: artifact
