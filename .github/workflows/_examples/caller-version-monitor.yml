# Example: paste this into .github/workflows/version-monitor.yml in any rtCamp repo.
# Requires a .github/version-monitor.yml config in the same repo — see README for shape.
name: Monthly Version Monitor

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC, first of each month
  workflow_dispatch:

jobs:
  run:
    uses: rtCamp/shared-workflows/.github/workflows/version-monitor.yml@v1
    with:
      base-branch: main
      pr-assignees: "alice,bob"
