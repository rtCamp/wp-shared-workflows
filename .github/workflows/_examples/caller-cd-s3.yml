# Reference caller for cd-s3.yml — copy into a plugin repo as
# .github/workflows/deploy-s3.yml. Lives in _examples/ (a subdirectory) so GitHub never
# auto-runs it: only files at the top of .github/workflows/ are discovered.
name: Deploy to S3

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Build and upload a single .zip in the SAME run — download-artifact only sees the
  # current run's artifacts.
  build:
    uses: rtCamp/shared-workflows/.github/workflows/ci-build.yml@v1
    with:
      upload-artifact: true
      artifact-name: s3-build
      # Override build-command / artifact-path so the artifact contains one .zip.

  deploy:
    needs: build
    uses: rtCamp/shared-workflows/.github/workflows/cd-s3.yml@v1
    with:
      tag: ${{ github.ref_name }}
      artifact-name: s3-build
      bucket: my-customer-bucket
      prefix: "plugins/my-plugin/"   # include the trailing slash
      # cloudfront-distribution-id: "E123ABC"   # optional: invalidate /<prefix>*
      # region: "us-east-1"                      # default; match the bucket's region
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
