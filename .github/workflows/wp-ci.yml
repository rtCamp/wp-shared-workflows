name: CI / Orchestrator

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      project-type:
        description: "Shape of the project at working-dir, selecting the job preset: plugin | theme | package. Describes the one unit this call targets, not the repository."
        type: string
        required: true
      working-dir:
        description: >-
          Directory holding the unit this run targets, relative to the repo root. '.' (default) is a
          single-project repo; where one repo holds several projects, call this workflow once per
          unit.
        type: string
        default: "."
      skip:
        description: >-
          Comma-separated job ids to drop, e.g. 'a11y, test-php'. Whitespace is ignored and an
          unknown id fails the run. Ids: lint-css, lint-js, lint-php, test-js, test-php, build,
          build-artifact, a11y, artifact-gate.
        type: string
        default: ""
      enable-phpstan:
        description: "Run PHPStan (whole-project) after PHPCS in the lint-php job."
        type: boolean
        default: false
      run-a11y:
        description: "Run the a11y (pa11y) job. Off by default — it is slow and needs pa11y config. Gate it on the 'Run a11y' label at the caller (see README)."
        type: boolean
        default: false
      use-wp-env:
        description: "Run test-php under @wordpress/env (default). Set false for a standalone Composer library that runs PHPUnit without WordPress."
        type: boolean
        default: true
      php-versions:
        description: "JSON array of PHP versions for test-php, crossed with wp-versions, e.g. '[\"8.2\",\"8.3\"]'. Must be non-empty — use skip: test-php to disable."
        type: string
        default: '["8.3"]'
      wp-versions:
        description: "JSON array of WordPress core versions for wp-env, crossed with php-versions, e.g. '[\"6.8\",\"6.9\"]'. An empty-string entry uses .wp-env.json. Ignored when use-wp-env is false."
        type: string
        default: '[""]'
      test-php-exclude:
        description: "JSON array of {php, wp} cells to drop from the php-versions × wp-versions product, e.g. '[{\"php\":\"8.1\",\"wp\":\"6.9\"}]'."
        type: string
        default: '[]'
      build-artifact-path:
        description: >-
          Path to the packaged, installable plugin/theme dir the build produces, e.g.
          'dist/my-plugin/'. Required to run the build-artifact install test; empty skips it (the
          default build emits bare build/, which is not installable).
        type: string
        default: ""
      build-artifact-slug:
        description: "Plugin/theme slug to activate in the build-artifact test. Empty uses working-dir's basename in a monorepo, or the repo name at the root."
        type: string
        default: ""
      ignore-paths:
        description: "Regex of paths detect-changes excludes from its counts and file lists. Empty uses the CLI's built-in ignore set."
        type: string
        default: ""
      base-ref:
        description: "Explicit git ref detect-changes, and the coverage gate when coverage is on, diff HEAD against. Write a branch as origin/<branch>: the coverage gate passes it straight to git rev-parse. Empty resolves it from the pull request base or the push event."
        type: string
        default: ""
      wp-tooling-ref:
        description: "Version or range of @rtcamp/wp-tooling that detect-changes, and the coverage gate when coverage is on, run from npm. Leave empty for ^2."
        type: string
        default: ""
      gated-paths:
        description: >-
          Newline-separated path prefixes, relative to working-dir, whose contents must not be
          committed in a PR (e.g. 'assets/build/'). Empty skips the artifact-gate job; set it only
          where CI generates the build output.
        type: string
        default: ""
      node-version:
        description: "Node.js version for every job that runs project code. Leave empty to read .nvmrc from working-dir, then the repo root, falling back to 22."
        type: string
        default: ""
      php-version:
        description: "PHP version for lint-php, build and build-artifact; test-php uses php-versions. Leave empty for each workflow's default."
        type: string
        default: ""
      composer-flags:
        description: "Flags for composer install in lint-php and test-php. Leave empty for each workflow's default."
        type: string
        default: ""
      build-composer-flags:
        description: "Flags for composer install in build, when install-composer-deps is true. Leave empty for ci-build.yml's default, which includes --no-dev."
        type: string
        default: ""
      install-composer-deps:
        description: "Install Composer dependencies before the build."
        type: boolean
        default: false
      build-command:
        description: "Shell command that produces the production build, for build and a11y. Leave empty for each workflow's default."
        type: string
        default: ""
      lint-css-command:
        description: "Shell command that runs Stylelint over the whole project. Leave empty for ci-lint-css.yml's default."
        type: string
        default: ""
      lint-css-files-command:
        description: "Shell command that runs Stylelint on the stylesheets passed to it, to lint only the changed ones. Leave empty to always lint the whole project."
        type: string
        default: ""
      lint-js-command:
        description: "Shell command that runs ESLint over the whole project. Leave empty for ci-lint-js.yml's default."
        type: string
        default: ""
      lint-js-files-command:
        description: "Shell command that runs ESLint on the files passed to it, to lint only the changed JS files. Leave empty to always lint the whole project."
        type: string
        default: ""
      phpcs-command:
        description: "PHPCS binary path or custom command. Leave empty for ci-lint-php.yml's default."
        type: string
        default: ""
      phpstan-command:
        description: "Shell command that runs PHPStan when enable-phpstan is true. Leave empty for ci-lint-php.yml's default."
        type: string
        default: ""
      test-js-command:
        description: "Shell command that runs Jest. With test-js-cache, it must forward its arguments to Jest (see ci-test-js.yml). Leave empty for ci-test-js.yml's default."
        type: string
        default: ""
      test-js-cache:
        description: "Cache Jest data across runs in test-js."
        type: boolean
        default: true
      test-php-command:
        description: "Shell command that runs PHPUnit. Leave empty for ci-test-php.yml's default."
        type: string
        default: ""
      a11y-command:
        description: "Shell command that runs pa11y-ci. Leave empty for ci-test-a11y.yml's default."
        type: string
        default: ""
      coverage:
        description: >-
          Measure coverage in test-js and in the first test-php matrix cell (the first of
          php-versions with the first of wp-versions), upload each HTML report as a
          coverage-php / coverage-js artifact, and fail when too few of the lines the pull request
          changed are covered. Pair with ci-coverage-comment.yml to post the summary on the pull
          request.
        type: boolean
        default: false
      coverage-threshold:
        description: "Minimum percentage (0 to 100) of changed executable lines that must be covered. Applies only when coverage is true."
        type: number
        default: 80

# project-type and working-dir are in the group so a monorepo caller invoking this workflow
# once per unit does not have one call cancel its siblings. Uses the RAW input because
# workflow-level concurrency cannot see job outputs. Only a pull request cancels its own older
# run: on a push, two quick merges to main would otherwise cancel the first and leave that
# commit with no status, so every other event gets a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ inputs.project-type }}-${{ inputs.working-dir }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      # Children must consume this, NOT inputs.working-dir: an unnormalised "" or
      # "./themes/foo" breaks cache-dependency-path and defeats artifact-gate's anchor.
      working-dir: ${{ steps.check.outputs.working-dir }}
      # The project-type preset minus skip, comma-bounded. Every job gates on this alone.
      jobs: ${{ steps.check.outputs.jobs }}
      artifact-name: ${{ steps.check.outputs.artifact-name }}
      coverage-php-artifact: ${{ steps.check.outputs.coverage-php-artifact }}
      coverage-js-artifact: ${{ steps.check.outputs.coverage-js-artifact }}
      artifact-slug: ${{ steps.check.outputs.artifact-slug }}
      install-path: ${{ steps.check.outputs.install-path }}
    steps:
      - name: Check inputs and resolve derived values
        id: check
        shell: bash
        env:
          PROJECT_TYPE: ${{ inputs.project-type }}
          WORKING_DIR: ${{ inputs.working-dir }}
          SKIP: ${{ inputs.skip }}
          PHP_VERSIONS: ${{ inputs.php-versions }}
          WP_VERSIONS: ${{ inputs.wp-versions }}
          TEST_PHP_EXCLUDE: ${{ inputs.test-php-exclude }}
          COVERAGE: ${{ inputs.coverage }}
          ARTIFACT_SLUG: ${{ inputs.build-artifact-slug }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # The preset as data, in one place, rather than a disjunction repeated in eight `if:`s.
          case "$PROJECT_TYPE" in
            plugin|theme) preset="lint-css,lint-js,lint-php,test-js,test-php,build,build-artifact,a11y,artifact-gate" ;;
            package)      preset="lint-php,test-php,artifact-gate" ;;
            *) echo "::error::project-type must be one of: plugin, theme, package (got '$PROJECT_TYPE')"; exit 1 ;;
          esac

          # Whitespace is dropped, so 'a11y, test-php' skips both, and an unknown id fails here
          # instead of silently running the job it was meant to drop. Skipping a job the preset
          # does not run is allowed, so one skip list can serve every unit in a caller's matrix.
          known=",lint-css,lint-js,lint-php,test-js,test-php,build,build-artifact,a11y,artifact-gate,"
          jobs=",${preset},"
          IFS=',' read -r -a skip_ids <<< "$(printf '%s' "$SKIP" | tr -d '[:space:]')"
          for id in "${skip_ids[@]}"; do
            [ -n "$id" ] || continue
            if [[ "$known" != *",${id},"* ]]; then
              echo "::error::skip names an unknown job '${id}'. Valid ids: ${known:1:${#known}-2}"
              exit 1
            fi
            jobs="${jobs/,"${id}",/,}"
          done

          dir="${WORKING_DIR:-.}"; dir="${dir#./}"; dir="${dir%/}"; [ -n "$dir" ] || dir="."
          case "$dir" in
            /*)   echo "::error::working-dir must be relative to the repo root (got '$WORKING_DIR')"; exit 1 ;;
            *..*) echo "::error::working-dir must not contain '..' (got '$WORKING_DIR')"; exit 1 ;;
          esac

          echo "$PHP_VERSIONS" | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "::error::php-versions must be a non-empty JSON array (got '$PHP_VERSIONS') — use skip: test-php to disable PHP tests"; exit 1; }
          echo "$WP_VERSIONS" | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "::error::wp-versions must be a non-empty JSON array (got '$WP_VERSIONS')"; exit 1; }
          echo "$TEST_PHP_EXCLUDE" | jq -e 'type == "array"' >/dev/null \
            || { echo "::error::test-php-exclude must be a JSON array (got '$TEST_PHP_EXCLUDE')"; exit 1; }

          # Coverage runs in the first test-php cell only, so excluding that cell would silently
          # measure nothing. An exclude entry that omits a key matches every value of it.
          if [ "$COVERAGE" = "true" ] && jq -e --argjson p "$PHP_VERSIONS" --argjson w "$WP_VERSIONS" \
            'any(.[]; ((has("php") | not) or ((.php | tostring) == ($p[0] | tostring)))
                      and ((has("wp") | not) or ((.wp | tostring) == ($w[0] | tostring))))' \
            <<< "$TEST_PHP_EXCLUDE" >/dev/null; then
            echo "::error::coverage runs in the first test-php cell (php $(jq -r '.[0]' <<< "$PHP_VERSIONS")," \
              "wp '$(jq -r '.[0]' <<< "$WP_VERSIONS")'), which test-php-exclude drops. Reorder php-versions or wp-versions."
            exit 1
          fi

          # upload-artifact rejects '/' in a name and 409s on a duplicate within a run, which
          # two units sharing one name would hit.
          if [ "$dir" = "." ]; then
            unit_suffix=""
          else
            unit_suffix="-$(printf '%s' "$dir" | sed 's/-/--/g; s|/|-|g' | tr -c 'a-zA-Z0-9._-' '-')"
          fi
          artifact_name="wp-ci-build${unit_suffix}"

          # A monorepo's repo name is rarely the slug, so prefer the target directory's basename.
          if [ -n "$ARTIFACT_SLUG" ]; then slug="$ARTIFACT_SLUG"
          elif [ "$dir" != "." ];    then slug="$(basename "$dir")"
          else                            slug="$REPO_NAME"
          fi

          if [ "$PROJECT_TYPE" = "theme" ]; then install_path="wp-content/themes"; else install_path="wp-content/plugins"; fi

          {
            echo "working-dir=${dir}"
            echo "jobs=${jobs}"
            echo "artifact-name=${artifact_name}"
            echo "coverage-php-artifact=coverage-php${unit_suffix}"
            echo "coverage-js-artifact=coverage-js${unit_suffix}"
            echo "artifact-slug=${slug}"
            echo "install-path=${install_path}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Target '${dir}' (${PROJECT_TYPE}) — artifact '${artifact_name}', slug '${slug}'."

  # A change under .github/workflows or .github/actions (gha-count) runs every job in the
  # preset and lints the whole project: a PR that only edits the caller's own workflow, such as
  # its wp-ci inputs, would otherwise pass green with nothing checked.
  detect-changes:
    name: Detect changes
    needs: [validate-inputs]
    uses: ./.github/workflows/ci-detect-changes.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      # A path scope, not a cwd — the detector still diffs from the repo root.
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}
      ignore-paths: ${{ inputs.ignore-paths }}
      base-ref: ${{ inputs.base-ref }}
      wp-tooling-ref: ${{ inputs.wp-tooling-ref }}

  lint-css:
    name: Lint CSS
    needs: [validate-inputs, detect-changes]
    if: >-
      (needs.detect-changes.outputs.css-count > 0 || needs.detect-changes.outputs.gha-count > 0)
      && contains(needs.validate-inputs.outputs.jobs, ',lint-css,')
    uses: ./.github/workflows/ci-lint-css.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      changed-files: ${{ needs.detect-changes.outputs.gha-count == 0 && needs.detect-changes.outputs.css-files || '' }}
      node-version: ${{ inputs.node-version }}
      lint-command: ${{ inputs.lint-css-command }}
      lint-files-command: ${{ inputs.lint-css-files-command }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  lint-js:
    name: Lint JS
    needs: [validate-inputs, detect-changes]
    if: >-
      (needs.detect-changes.outputs.js-count > 0 || needs.detect-changes.outputs.gha-count > 0)
      && contains(needs.validate-inputs.outputs.jobs, ',lint-js,')
    uses: ./.github/workflows/ci-lint-js.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      changed-files: ${{ needs.detect-changes.outputs.gha-count == 0 && needs.detect-changes.outputs.js-files || '' }}
      node-version: ${{ inputs.node-version }}
      lint-command: ${{ inputs.lint-js-command }}
      lint-files-command: ${{ inputs.lint-js-files-command }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  lint-php:
    name: Lint PHP
    needs: [validate-inputs, detect-changes]
    if: >-
      (needs.detect-changes.outputs.php-count > 0 || needs.detect-changes.outputs.gha-count > 0)
      && contains(needs.validate-inputs.outputs.jobs, ',lint-php,')
    uses: ./.github/workflows/ci-lint-php.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      changed-files: ${{ needs.detect-changes.outputs.gha-count == 0 && needs.detect-changes.outputs.php-files || '' }}
      enable-phpstan: ${{ inputs.enable-phpstan }}
      php-version: ${{ inputs.php-version }}
      composer-flags: ${{ inputs.composer-flags }}
      phpcs-command: ${{ inputs.phpcs-command }}
      phpstan-command: ${{ inputs.phpstan-command }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  test-js:
    name: Test JS
    needs: [validate-inputs, detect-changes]
    if: >-
      (needs.detect-changes.outputs.js-count > 0 || needs.detect-changes.outputs.gha-count > 0)
      && contains(needs.validate-inputs.outputs.jobs, ',test-js,')
    uses: ./.github/workflows/ci-test-js.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      node-version: ${{ inputs.node-version }}
      test-command: ${{ inputs.test-js-command }}
      enable-cache: ${{ inputs.test-js-cache }}
      coverage: ${{ inputs.coverage }}
      coverage-threshold: ${{ inputs.coverage-threshold }}
      coverage-artifact-name: ${{ needs.validate-inputs.outputs.coverage-js-artifact }}
      base-ref: ${{ inputs.base-ref }}
      wp-tooling-ref: ${{ inputs.wp-tooling-ref }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  test-php:
    # Named explicitly: GitHub's default suffix for this matrix renders as "(8.3, )".
    name: Test PHP ${{ matrix.php }}${{ matrix.wp != '' && format(', WP {0}', matrix.wp) || '' }}
    needs: [validate-inputs, detect-changes]
    if: >-
      (needs.detect-changes.outputs.php-count > 0 || needs.detect-changes.outputs.gha-count > 0)
      && contains(needs.validate-inputs.outputs.jobs, ',test-php,')
    # Matrix: php-versions × wp-versions, minus test-php-exclude cells. With use-wp-env
    # (default) each cell boots @wordpress/env, pinning PHP + WP core; with use-wp-env
    # false it runs standalone PHPUnit and the wp dimension is inert.
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        wp: ${{ fromJSON(inputs.wp-versions) }}
        exclude: ${{ fromJSON(inputs.test-php-exclude) }}
    uses: ./.github/workflows/ci-test-php.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      php-version: ${{ matrix.php }}
      wp-version: ${{ matrix.wp }}
      use-wp-env: ${{ inputs.use-wp-env }}
      node-version: ${{ inputs.node-version }}
      test-command: ${{ inputs.test-php-command }}
      composer-flags: ${{ inputs.composer-flags }}
      # One cell only: several would multiply the cost and produce gates that can disagree.
      coverage: ${{ inputs.coverage && matrix.php == fromJSON(inputs.php-versions)[0] && matrix.wp == fromJSON(inputs.wp-versions)[0] }}
      coverage-threshold: ${{ inputs.coverage-threshold }}
      coverage-artifact-name: ${{ needs.validate-inputs.outputs.coverage-php-artifact }}
      base-ref: ${{ inputs.base-ref }}
      wp-tooling-ref: ${{ inputs.wp-tooling-ref }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  build:
    name: Build
    needs: [validate-inputs, detect-changes]
    if: >-
      (needs.detect-changes.outputs.css-count > 0 || needs.detect-changes.outputs.js-count > 0 || needs.detect-changes.outputs.php-count > 0
        || needs.detect-changes.outputs.gha-count > 0)
      && contains(needs.validate-inputs.outputs.jobs, ',build,')
    uses: ./.github/workflows/ci-build.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      # Only upload when build-artifact runs (it consumes this); otherwise build just compiles.
      upload-artifact: ${{ inputs.build-artifact-path != '' }}
      artifact-name: ${{ needs.validate-inputs.outputs.artifact-name }}
      artifact-path: ${{ inputs.build-artifact-path }}
      retention-days: 1
      node-version: ${{ inputs.node-version }}
      php-version: ${{ inputs.php-version }}
      install-composer-deps: ${{ inputs.install-composer-deps }}
      composer-flags: ${{ inputs.build-composer-flags }}
      build-command: ${{ inputs.build-command }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  # Opt-in: runs only when build-artifact-path points at an installable dir, since the default
  # build emits bare build/.
  build-artifact:
    name: Test build artifact
    needs: [validate-inputs, detect-changes, build]
    if: >-
      inputs.build-artifact-path != ''
      && (needs.detect-changes.outputs.css-count > 0 || needs.detect-changes.outputs.js-count > 0 || needs.detect-changes.outputs.php-count > 0
        || needs.detect-changes.outputs.gha-count > 0)
      && contains(needs.validate-inputs.outputs.jobs, ',build-artifact,')
    uses: ./.github/workflows/ci-test-build-artifact.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      artifact-name: ${{ needs.validate-inputs.outputs.artifact-name }}
      slug: ${{ needs.validate-inputs.outputs.artifact-slug }}
      install-path: ${{ needs.validate-inputs.outputs.install-path }}
      node-version: ${{ inputs.node-version }}
      php-version: ${{ inputs.php-version }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  # Opt-in: a11y is slow and needs pa11y config, so it stays off unless run-a11y is set
  # (wire it to the 'Run a11y' label at the caller). Matches the label-gated convention.
  a11y:
    name: Test accessibility
    needs: [validate-inputs, detect-changes]
    if: >-
      inputs.run-a11y
      && (needs.detect-changes.outputs.css-count > 0 || needs.detect-changes.outputs.js-count > 0 || needs.detect-changes.outputs.php-count > 0
        || needs.detect-changes.outputs.gha-count > 0)
      && contains(needs.validate-inputs.outputs.jobs, ',a11y,')
    uses: ./.github/workflows/ci-test-a11y.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      node-version: ${{ inputs.node-version }}
      build-command: ${{ inputs.build-command }}
      test-command: ${{ inputs.a11y-command }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  # Opt-in via gated-paths: fails a PR that commits build output, which is only correct where
  # CI produces it. Needs only validate-inputs, so it runs alongside detect-changes.
  artifact-gate:
    name: Block committed build artifacts
    needs: [validate-inputs]
    if: >-
      inputs.gated-paths != ''
      && contains(needs.validate-inputs.outputs.jobs, ',artifact-gate,')
    uses: ./.github/workflows/ci-build-artifact-gate.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      gated-paths: ${{ inputs.gated-paths }}
      working-dir: ${{ needs.validate-inputs.outputs.working-dir }}

  # The one check to require in branch protection: "<caller job> / CI result". The other check
  # names and their count change with project-type, skip, what changed and the PHP matrix, and a
  # skipped required check counts as passing. Runs on always(), so a failed, cancelled or
  # never-started job fails it, while a job skipped by its own gate does not.
  ci-result:
    name: CI result
    needs:
      - validate-inputs
      - detect-changes
      - lint-css
      - lint-js
      - lint-php
      - test-js
      - test-php
      - build
      - build-artifact
      - a11y
      - artifact-gate
    if: always()
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Check every job's result
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| `\(.key)` | \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::CI did not pass: $(printf '%s' "$bad" | paste -sd ',' - | sed 's/,/, /g')."
            exit 1
          fi
          echo "Every job passed or was skipped by its own gate."
