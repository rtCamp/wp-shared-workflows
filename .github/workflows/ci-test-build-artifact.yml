name: CI / Test Build Artifact

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      artifact-name:
        description: "Artifact to download. Must match the artifact-name uploaded by ci-build.yml in the same run."
        type: string
        required: true
      slug:
        description: "Plugin or theme directory slug to activate inside wp-env."
        type: string
        required: true
      node-version:
        description: "Node.js version used to run @wordpress/env. Leave empty to read .nvmrc from working-dir, then the repo root, falling back to 22."
        type: string
        default: ""
      php-version:
        description: "PHP version wp-env boots with. Leave empty for 8.3."
        type: string
        default: ""
      wp-version:
        description: >-
          WordPress core wp-env boots: 'latest' (newest stable release), 'trunk' (development branch),
          or a specific WordPress version (e.g. '6.8' for the latest 6.8.x or '6.8.2' for a specific
          patch version).
        type: string
        default: "latest"
      install-path:
        description: "Destination under the WordPress root to mount the artifact. A path ending in 'themes' activates a theme; otherwise a plugin."
        type: string
        default: "wp-content/plugins"
      smoke-script:
        description: "Optional path inside the artifact to a shell script, run in the wp-env container after activation. Empty skips the step."
        type: string
        default: ""
      doctor-ignore-checks:
        description: "Comma-separated wp doctor check names excluded from the error gate. Defaults to production-oriented checks that wp-env's dev defaults always trip (e.g. WP_DEBUG being on)."
        type: string
        default: "constant-wp-debug-falsy"
      working-dir:
        description: >-
          Working directory for monorepos. wp-env runs here and the artifact is downloaded into it.
          Note: a .wp-env.override.json is written here, overwriting any existing file of that name.
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test-build-artifact:
    name: Boot artifact in wp-env
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Node version: the input, else .nvmrc (working-dir, then repo root), else 22.
      - name: Resolve Node.js version
        id: node
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # setup-node reads the file path from the repo root.
          if [ -n "$NODE_VERSION" ]; then
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/$WORKING_DIR/.nvmrc" ]; then
            echo "file=$WORKING_DIR/.nvmrc" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          # download-artifact is a JS action: its path is workspace-relative, so it has to
          # carry working-dir itself.
          path: ${{ inputs.working-dir }}/artifact

      - name: Write wp-env override
        shell: bash
        env:
          WP_VERSION: ${{ inputs.wp-version }}
          PHP_VERSION: ${{ inputs.php-version || '8.3' }}
          INSTALL_PATH: ${{ inputs.install-path }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail

          case "$WP_VERSION" in
            latest) core="" ;;
            trunk) core="WordPress/WordPress#master" ;;
            *)
              # x.y means its newest x.y.z; the WordPress/WordPress mirror tags x.y.0 releases as x.y.
              if [[ "$WP_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
                ref=$(git ls-remote --tags --refs --sort=version:refname https://github.com/WordPress/WordPress.git "$WP_VERSION" "$WP_VERSION.*" \
                  | tail -n1 | sed 's|.*refs/tags/||')
              elif [[ "$WP_VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
                ref=${WP_VERSION%.0}
              else
                ref=$WP_VERSION
              fi
              if [[ ! "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                echo "::error::wp-version '$WP_VERSION' matches no WordPress release."
                exit 1
              fi
              core="WordPress/WordPress#$ref"
              ;;
          esac

          # Mount only the artifact; a consumer's .wp-env.json usually mounts the dev source (".") at the same path.
          jq -n \
            --arg core "$core" \
            --arg php "$PHP_VERSION" \
            --arg dest "${INSTALL_PATH%/}/${SLUG}" \
            '{
               core: (if $core == "" then null else $core end),
               phpVersion: $php,
               plugins: [],
               themes: [],
               mappings: { ($dest): "./artifact" }
             }' > .wp-env.override.json

          echo "Generated .wp-env.override.json:"
          cat .wp-env.override.json

      # wp-env keeps WordPress core and the PHPUnit test library under WP_ENV_HOME
      # (default ~/.wp-env) and bind-mounts them into its containers. On self-hosted
      # runners whose Docker daemon runs in a separate container (ARC with dind), only
      # the work directory is shared with the daemon, so mounts from ~ come up empty and
      # PHPUnit fails to load /wordpress-phpunit. RUNNER_TEMP is inside the work
      # directory on every runner type, and the runner sets it, so writing it to
      # $GITHUB_ENV is safe.
      - name: Keep wp-env files in the runner work directory
        shell: bash
        run: echo "WP_ENV_HOME=$RUNNER_TEMP/wp-env" >> "$GITHUB_ENV"

      - name: Start wp-env
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @wordpress/env start --update

      - name: Activate plugin or theme
        shell: bash
        env:
          INSTALL_PATH: ${{ inputs.install-path }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail

          case "${INSTALL_PATH%/}" in
            */themes) TYPE=theme ;;
            *) TYPE=plugin ;;
          esac

          echo "Activating ${TYPE}: ${SLUG}"
          npx --yes @wordpress/env run cli wp "$TYPE" activate "$SLUG"

      - name: Run wp doctor
        shell: bash
        env:
          # WordPress.org publishes no checksums for trunk builds.
          DOCTOR_IGNORE_CHECKS: >-
            ${{ inputs.wp-version == 'trunk' && format('{0},core-verify-checksums', inputs.doctor-ignore-checks)
            || inputs.doctor-ignore-checks }}
        run: |
          set -euo pipefail

          # 3.x requires WP-CLI 3; wp-env ships 2.12.
          npx --yes @wordpress/env run cli wp package install wp-cli/doctor-command:2.3.1

          # `wp doctor check` exits 1 on an error check; capture anyway (|| true) so the report prints before we gate.
          result=$(npx --yes @wordpress/env run cli wp doctor check --all --format=json) || true
          echo "$result"

          # wp-env enables WP_DEBUG by default, tripping production-only checks unrelated to the artifact; drop those.
          failed=$(jq -c --arg ignore "$DOCTOR_IGNORE_CHECKS" '
            ($ignore | split(",") | map(gsub("(^\\s+|\\s+$)"; "")) | map(select(length > 0))) as $skip
            | [ .[] | select(.status == "error") | select([.name] | inside($skip) | not) ]
          ' <<<"$result")

          count=$(jq 'length' <<<"$failed")
          if [[ "$count" -gt 0 ]]; then
            echo "::error::wp doctor reported ${count} error-severity check(s):"
            jq -r '.[] | "  - \(.name): \(.message)"' <<<"$failed"
            exit 1
          fi

          echo "wp doctor passed (no error-severity checks; ignored: ${DOCTOR_IGNORE_CHECKS:-none})."

      - name: Run smoke script
        if: ${{ inputs.smoke-script != '' }}
        shell: bash
        env:
          INSTALL_PATH: ${{ inputs.install-path }}
          SLUG: ${{ inputs.slug }}
          SMOKE_SCRIPT: ${{ inputs.smoke-script }}
        run: |
          set -euo pipefail
          npx --yes @wordpress/env run cli bash "${INSTALL_PATH%/}/${SLUG}/${SMOKE_SCRIPT}"

      - name: Stop wp-env
        if: always()
        timeout-minutes: 2
        shell: bash
        run: npx --yes @wordpress/env stop
