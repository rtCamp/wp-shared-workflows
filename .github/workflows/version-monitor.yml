name: Version Monitor

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version used to install and run wp-tooling"
        type: string
        default: "22"
      base-branch:
        description: "Branch to open the PR against"
        type: string
        default: "main"
      pr-label:
        description: "Label to apply to the draft PR"
        type: string
        default: "version-monitor"
      pr-assignees:
        description: "Comma-separated GitHub usernames to assign to the draft PR"
        type: string
        default: ""
    secrets:
      wp-tooling-token:
        description: "Token with read access to the private rtCamp/wp-tooling repo, used to clone the interim CLI. Required while that repo is private."
        required: false

# Serialise runs per consumer repo so a scheduled run and a manual dispatch can't
# race on the same version-monitor/YYYY-MM branch.
concurrency:
  group: version-monitor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify version-monitor config present
        run: |
          if [ ! -f ".github/version-monitor.yml" ]; then
            echo "::error::.github/version-monitor.yml not found in caller repo. See README for required config shape."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install wp-tooling
        # Interim until @rtcamp/wp-tooling is published: the CLI is a subpath of the private
        # rtCamp/wp-tooling monorepo (npm can't install a git subdir), so clone the branch and
        # copy-install it (--install-links, not a symlink) into a job-local prefix on PATH.
        # Auth the clone with wp-tooling-token when set; a plain clone works only if public.
        shell: bash
        env:
          WP_TOOLING_TOKEN: ${{ secrets.wp-tooling-token }}
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          trap 'rm -rf "$src"' EXIT
          repo="https://github.com/rtCamp/wp-tooling.git"
          if [ -n "${WP_TOOLING_TOKEN:-}" ]; then
            repo="https://x-access-token:${WP_TOOLING_TOKEN}@github.com/rtCamp/wp-tooling.git"
          fi
          git clone --depth 1 --branch release/v1.0.0 "$repo" "$src"
          prefix="$RUNNER_TEMP/wp-tooling"
          npm install --install-links --prefix "$prefix" "$src/node-packages/wp-tooling"
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Detect version updates
        id: detect
        # Detectors that hit the GitHub API (actions, etc.) read GITHUB_TOKEN to
        # avoid the unauthenticated 60/hour shared-runner rate limit; Actions does
        # not export it to run steps automatically, so map it here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --detect prints valid (maybe partial) JSON, then exits 1 if a detector
          # errored. Capture the status so `bash -e` can't abort and drop results.
          set +e
          wp-tooling version-monitor --detect > "$RUNNER_TEMP/updates.json"
          status=$?
          set -e

          # `jq -e` (plain jq exits 0 on an empty file) fails when detect emitted no
          # JSON at all — a usage/config error or a throw, so there's nothing to do.
          if ! count=$(jq -e 'length' "$RUNNER_TEMP/updates.json" 2>/dev/null); then
            echo "::error::version-monitor --detect produced no valid JSON (exit ${status}). Cannot continue."
            exit 1
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"

          # Partial results: proceed to a PR, but record it to fail the job at the end.
          if [ "${status}" -ne 0 ]; then
            echo "detectors_errored=true" >> "$GITHUB_OUTPUT"
            echo "::warning::version-monitor: one or more detectors errored (exit ${status}); proceeding with ${count} partial result(s). The run will be marked failed so the blind source is investigated — see this step's log for details."
          else
            echo "detectors_errored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — no updates this month
        if: steps.detect.outputs.count == '0'
        run: echo "No updates detected this month. Exiting cleanly."

      - name: Set monthly branch name
        if: steps.detect.outputs.count != '0'
        id: monthly
        run: |
          MONTH=$(date +%Y-%m)
          echo "branch=version-monitor/$MONTH" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - name: Apply updates and generate PR report
        if: steps.detect.outputs.count != '0'
        run: |
          wp-tooling version-monitor --apply < "$RUNNER_TEMP/updates.json"
          wp-tooling version-monitor --report < "$RUNNER_TEMP/updates.json" > "$RUNNER_TEMP/pr-body.md"

      - name: Open or update draft PR
        id: pr
        if: steps.detect.outputs.count != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.monthly.outputs.branch }}
          base: ${{ inputs.base-branch }}
          title: "chore(deps): monthly version monitor — ${{ steps.monthly.outputs.month }}"
          body-path: ${{ runner.temp }}/pr-body.md
          draft: true
          labels: ${{ inputs.pr-label }}
          assignees: ${{ inputs.pr-assignees }}
          commit-message: "chore(deps): monthly version monitor — ${{ steps.monthly.outputs.month }}"

      - name: Flag detected updates that produced no PR
        # Updates found but nothing applied (all major, or unmatched) → no diff, no
        # PR. Fail with the report so the bumps aren't silently dropped.
        if: steps.detect.outputs.count != '0' && steps.pr.outputs.pull-request-number == ''
        run: |
          echo "::error::version-monitor detected ${{ steps.detect.outputs.count }} update(s) but produced no file changes, so no PR was opened — every bump is a major-version bump (skipped pending manual review) or a value could not be matched in its file. Apply these manually:"
          cat "$RUNNER_TEMP/pr-body.md"
          exit 1

      - name: Fail if any detector could not be checked
        # A detector was blind this run — fail even if a partial-results PR opened.
        if: always() && steps.detect.outputs.detectors_errored == 'true'
        run: |
          echo "::error::version-monitor: one or more detectors errored this run, so the results are incomplete. Any PR opened above carries only the updates that were found. See the 'Detect version updates' step log for the failing detector(s)."
          exit 1
