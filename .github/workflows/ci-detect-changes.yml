name: CI / Detect Changes

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version used to run the wp-tooling CLI."
        type: string
        default: "22"
      ignore-paths:
        description: "Regex of paths to exclude from the counts and file lists. Empty uses the CLI's built-in ignore set."
        type: string
        default: ""
      base-ref:
        description: "Explicit git ref to diff HEAD against. Empty lets the CLI resolve it from the PR base or push event."
        type: string
        default: ""
    outputs:
      total-count:
        description: "Number of changed files after the ignore filter."
        value: ${{ jobs.detect.outputs.total-count }}
      ignored-count:
        description: "Number of changed files dropped by the ignore filter."
        value: ${{ jobs.detect.outputs.ignored-count }}
      css-count:
        description: "Number of changed CSS/SCSS files."
        value: ${{ jobs.detect.outputs.css-count }}
      js-count:
        description: "Number of changed JS files."
        value: ${{ jobs.detect.outputs.js-count }}
      php-count:
        description: "Number of changed PHP files."
        value: ${{ jobs.detect.outputs.php-count }}
      gha-count:
        description: "Number of changed GitHub Actions workflow files."
        value: ${{ jobs.detect.outputs.gha-count }}
      css-files:
        description: "Newline-separated changed CSS/SCSS files. Pass straight into ci-lint-css.yml's changed-files."
        value: ${{ jobs.detect.outputs.css-files }}
      js-files:
        description: "Newline-separated changed JS files. Pass straight into ci-lint-js.yml's changed-files."
        value: ${{ jobs.detect.outputs.js-files }}
      php-files:
        description: "Newline-separated changed PHP files. Pass straight into ci-lint-php.yml's changed-files."
        value: ${{ jobs.detect.outputs.php-files }}
      gha-files:
        description: "Newline-separated changed GitHub Actions workflow files."
        value: ${{ jobs.detect.outputs.gha-files }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      total-count: ${{ steps.detect.outputs.total-count }}
      ignored-count: ${{ steps.detect.outputs.ignored-count }}
      css-count: ${{ steps.detect.outputs.css-count }}
      js-count: ${{ steps.detect.outputs.js-count }}
      php-count: ${{ steps.detect.outputs.php-count }}
      gha-count: ${{ steps.detect.outputs.gha-count }}
      css-files: ${{ steps.detect.outputs.css-files }}
      js-files: ${{ steps.detect.outputs.js-files }}
      php-files: ${{ steps.detect.outputs.php-files }}
      gha-files: ${{ steps.detect.outputs.gha-files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install wp-tooling
        # Interim install until @rtcamp/wp-tooling is published to GitHub Packages.
        # The package lives in the rtCamp/wp-tooling *monorepo* under
        # node-packages/wp-tooling. npm cannot install a git subdirectory, and the
        # repo root is a private, bin-less workspace, so `npm i -g <giturl>` / a
        # git-URL npx invocation expose no CLI. The package has zero runtime deps,
        # so cloning the subpath and installing it globally just links the bin.
        # TODO(wp-tooling publish): drop this step and invoke detect-changes via
        #   npx --yes --package=@rtcamp/wp-tooling wp-tooling detect-changes "${args[@]}"
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch release/v1.0.0 \
            https://github.com/rtCamp/wp-tooling.git "$tmp"
          npm install --global "$tmp/node-packages/wp-tooling"

      - name: Detect changed files
        id: detect
        shell: bash
        env:
          IGNORE_PATHS: ${{ inputs.ignore-paths }}
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          set -euo pipefail
          args=(--output github --include-files)
          if [ -n "$IGNORE_PATHS" ]; then
            args+=(--ignore "$IGNORE_PATHS")
          fi
          if [ -n "$BASE_REF" ]; then
            args+=(--base "$BASE_REF")
          fi
          wp-tooling detect-changes "${args[@]}"
