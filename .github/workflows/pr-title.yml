name: PR Title

# Squash merges use the PR title as the commit subject, and release-please reads those subjects to
# pick the next version and write CHANGELOG.md. A title that is not a Conventional Commit is
# invisible to it.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR title
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No `ci`: nearly everything in this repo is CI, so a change callers see is `fix`/`feat`
        # and one that only touches this repo's own files is `chore`.
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            refactor
            test
            build
