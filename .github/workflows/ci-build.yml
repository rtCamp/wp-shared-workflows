name: CI / Build

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      install-node-deps:
        description: "Install Node dependencies before the build."
        type: boolean
        default: true
      node-version:
        description: "Node.js version, used only when install-node-deps is true. Leave empty to read .nvmrc from working-dir, then the repo root, falling back to 22."
        type: string
        default: ""
      install-composer-deps:
        description: "Install Composer dependencies before the build."
        type: boolean
        default: false
      php-version:
        description: "PHP version, used only when install-composer-deps is true. Leave empty for 8.3."
        type: string
        default: ""
      composer-flags:
        description: >-
          Flags passed to composer install. Leave empty for '--no-dev --prefer-dist
          --optimize-autoloader'. The root package's Composer scripts run; add --no-scripts to
          skip them.
        type: string
        default: ""
      build-command:
        description: "Shell command that produces the production build. When empty, defaults to 'npm run build:prod' if install-node-deps is true, otherwise 'composer run-script build'."
        type: string
        default: ""
      upload-artifact:
        description: "Upload the build output as a GitHub Actions artifact for downstream jobs."
        type: boolean
        default: false
      artifact-name:
        description: "Name used when uploading the artifact (and when a CD job downloads it)."
        type: string
        default: "build"
      artifact-path:
        description: "Path to upload. Relative to working-dir."
        type: string
        default: "build/"
      retention-days:
        description: "Days to keep the artifact before GitHub deletes it."
        type: number
        default: 7
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Node version: the input, else .nvmrc (working-dir, then repo root), else 22.
      - name: Resolve Node.js version
        id: node
        if: ${{ inputs.install-node-deps }}
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # setup-node reads the file path from the repo root.
          if [ -n "$NODE_VERSION" ]; then
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -s .nvmrc ]; then
            echo "file=$WORKING_DIR/.nvmrc" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ inputs.install-node-deps }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Set up PHP
        if: ${{ inputs.install-composer-deps }}
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # 2.37.0
        with:
          php-version: ${{ inputs.php-version || '8.3' }}
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        if: ${{ inputs.install-composer-deps }}
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda  # 4.0.0
        with:
          working-directory: ${{ inputs.working-dir }}
          composer-options: ${{ inputs.composer-flags || '--no-dev --prefer-dist --optimize-autoloader' }}

      - name: Install npm dependencies
        if: ${{ inputs.install-node-deps }}
        run: npm ci

      - name: Build production assets
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command != '' && inputs.build-command || (inputs.install-node-deps && 'npm run build:prod' || 'composer run-script build') }}
        run: bash -eo pipefail -c "$BUILD_COMMAND"

      - name: Upload build artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-dir }}/${{ inputs.artifact-path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
