name: CI / Lint JS

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node.js version. Leave empty to read .nvmrc from working-dir, then the repo root, falling back to 22."
        type: string
        default: ""
      lint-command:
        description: "Shell command that lints the whole project, as developers run it locally. Leave empty for 'npm run lint:js'."
        type: string
        default: ""
      lint-files-command:
        description: >-
          Shell command that lints only the files passed to it as arguments, such as
          'npm run lint:js:files'. Set it to lint just the changed JS files; leave it empty to
          always run lint-command.
        type: string
        default: ""
      changed-files:
        description: >-
          Newline-separated changed files (ci-detect-changes' js-files). When lint-files-command is
          set and every path is a JS file that still exists, only those files are linted. A removed
          file, package.json, package-lock.json or an ESLint, Prettier or Babel config lints the
          whole project with lint-command, since it can break files the change did not touch. Jest
          snapshots alone skip ESLint.
        type: string
        default: ""
      validate-package-json:
        description: "Run `npm run lint:package-json` before ESLint."
        type: boolean
        default: true
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint-js:
    name: ESLint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Node version: the input, else .nvmrc (working-dir, then repo root), else 22.
      - name: Resolve Node.js version
        id: node
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # setup-node reads the file path from the repo root.
          if [ -n "$NODE_VERSION" ]; then
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/$WORKING_DIR/.nvmrc" ]; then
            echo "file=$WORKING_DIR/.nvmrc" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Validate package.json
        if: ${{ inputs.validate-package-json }}
        run: npm run lint:package-json --if-present

      # ESLint errors become PR annotations through setup-node's problem matcher.
      - name: Run ESLint
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed-files }}
          LINT_COMMAND: ${{ inputs.lint-command || 'npm run lint:js' }}
          LINT_FILES_COMMAND: ${{ inputs.lint-files-command }}
        run: |
          set -euo pipefail

          # A removed file, package.json, the lockfile or a lint config can break files the change
          # did not touch, so any of them lints the whole project. "./" keeps -x.js a path.
          source_pattern='\.(js|cjs|mjs|ts|cts|mts|jsx|tsx)$'
          config_pattern='(^|/)(eslint\.config|prettier\.config|babel\.config|\.eslintrc|\.prettierrc|\.babelrc)\.[^/]+$'

          files=()
          full_lint_reason=""

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            [[ "$file" != *.snap ]] || continue

            if [[ ! -f "$file" ]]; then
              full_lint_reason="$file was removed"
              break
            fi

            if [[ ! "$file" =~ $source_pattern ]] || [[ "$file" =~ $config_pattern ]]; then
              full_lint_reason="$file changed"
              break
            fi

            files+=("./$file")
          done <<< "$CHANGED_FILES"

          if [[ -n "$CHANGED_FILES" && -z "$full_lint_reason" && ${#files[@]} -eq 0 ]]; then
            echo "::notice::Nothing to lint: only Jest snapshots changed."
            exit 0
          fi

          if [[ -n "$LINT_FILES_COMMAND" && -z "$full_lint_reason" && ${#files[@]} -gt 0 ]]; then
            bash -eo pipefail -c "$LINT_FILES_COMMAND \"\$@\"" _ "${files[@]}"
          else
            if [[ -n "$full_lint_reason" ]]; then
              echo "::notice::Linting the whole project: $full_lint_reason."
            fi

            bash -eo pipefail -c "$LINT_COMMAND"
          fi
