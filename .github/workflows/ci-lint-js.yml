name: CI / Lint JS

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to install on the runner."
        type: string
        default: "22"
      lint-command:
        description: "Shell command that runs ESLint. Must exit non-zero on lint failure."
        type: string
        default: "npm run lint:js"
      enable-package-json-validation:
        description: "When true, also run the package.json validation command."
        type: boolean
        default: true
      package-json-command:
        description: |
          Shell command that validates package.json. Default uses `--if-present`
          so the step is a no-op when the script is missing — flip the toggle
          off to skip the step entirely.
        type: string
        default: "npm run lint:package-json --if-present"

permissions:
  contents: read

jobs:
  lint-js:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Validate package.json
        if: ${{ inputs.enable-package-json-validation }}
        run: ${{ inputs.package-json-command }}

      - name: Run ESLint
        run: ${{ inputs.lint-command }}
