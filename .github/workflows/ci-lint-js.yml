name: CI / Lint JS

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      lint-command:
        description: "Shell command that runs ESLint over the whole project. Used when changed-files is empty."
        type: string
        default: "npm run lint:js"
      changed-files:
        description: "Newline-separated changed files (ci-detect-changes' js-files). Scripts that still exist are linted file by file; if the list is empty, holds only deleted scripts, or holds anything else (package.json, package-lock.json), lint-command runs over the whole project."
        type: string
        default: ""
      validate-package-json:
        description: "Run `npm run lint:package-json` before ESLint."
        type: boolean
        default: true
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint-js:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Validate package.json
        if: ${{ inputs.validate-package-json }}
        run: npm run lint:package-json --if-present

      - name: Run ESLint
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed-files }}
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: |
          # js-files can name scripts the change deleted, and ESLint exits 2 with
          # "No files matching the pattern" for each one. It also lists package.json
          # and package-lock.json, so a dependency change re-runs this job; a
          # dependency change can affect every script, so lint the whole project then.
          scripts=$(printf '%s\n' "$CHANGED_FILES" | grep -E '\.[cm]?[jt]sx?$' \
            | while IFS= read -r file; do [ ! -f "$file" ] || printf '%s\n' "$file"; done || true)
          others=$(printf '%s\n' "$CHANGED_FILES" | grep -vE '^$|\.[cm]?[jt]sx?$' || true)
          if [ -n "$scripts" ] && [ -z "$others" ]; then
            printf '%s\n' "$scripts" | xargs -d '\n' --no-run-if-empty npx --no-install eslint --
          else
            bash -eo pipefail -c "$LINT_COMMAND"
          fi
