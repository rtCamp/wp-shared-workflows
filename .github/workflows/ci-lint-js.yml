name: CI / Lint JS

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      lint-command:
        description: "Shell command that runs ESLint over the whole project. Used when changed-files is empty."
        type: string
        default: "npm run lint:js"
      changed-files:
        description: "Newline-separated list of JS files to lint. Empty = run lint-command over the whole project."
        type: string
        default: ""
      validate-package-json:
        description: "Run `npm run lint:package-json` before ESLint."
        type: boolean
        default: true
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint-js:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Validate package.json
        if: ${{ inputs.validate-package-json }}
        run: npm run lint:package-json --if-present

      - name: Run ESLint
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed-files }}
        run: |
          if [ -n "$CHANGED_FILES" ]; then
            printf '%s\n' "$CHANGED_FILES" | xargs -d '\n' --no-run-if-empty npx --no-install eslint --
          else
            ${{ inputs.lint-command }}
          fi
