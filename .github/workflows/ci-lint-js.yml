name: CI / Lint JS

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      lint-command:
        description: "Shell command that runs ESLint over the whole project. Used when changed-files is empty."
        type: string
        default: "npm run lint:js"
      changed-files:
        description: "Newline-separated list of JS files to lint. Empty = run lint-command over the whole project."
        type: string
        default: ""
      validate-package-json:
        description: "Run `npm run lint:package-json` before ESLint."
        type: boolean
        default: true
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint-js:
    name: ESLint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Validate package.json
        if: ${{ inputs.validate-package-json }}
        run: npm run lint:package-json --if-present

      - name: Run ESLint
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed-files }}
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: |
          if [ -n "$CHANGED_FILES" ]; then
            printf '%s\n' "$CHANGED_FILES" | xargs -d '\n' --no-run-if-empty npx --no-install eslint --
          else
            bash -eo pipefail -c "$LINT_COMMAND"
          fi
