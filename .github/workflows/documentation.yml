name: Build and deploy documentation

on:
  workflow_call:
    inputs:
      source-directory:
        description: Project directory relative to the consumer checkout.
        type: string
        default: '.'
      docs-directory:
        description: Markdown directory relative to source-directory; index.md is the homepage.
        type: string
        default: docs
      source-branch:
        description: Branch allowed to publish; empty uses the consumer default branch.
        type: string
        default: ''
      site-title:
        description: Site title; empty uses the consumer repository name.
        type: string
        default: ''
      site-config:
        description: Optional branding JSON file relative to source-directory.
        type: string
        default: ''
      site-url:
        description: Site origin; empty uses Pages configuration or https://OWNER.github.io for validation.
        type: string
        default: ''
      base-url:
        description: Site path; empty uses Pages configuration or the repository path for validation.
        type: string
        default: ''
      sidebar:
        description: Optional JSON array of Docusaurus sidebar items; empty generates it from docs.
        type: string
        default: ''
      node-version:
        description: Node.js version for the standalone builder (22 or later).
        type: string
        default: '22'
      tooling-ref:
        description: wp-shared-workflows builder revision; match the reusable workflow revision when pinning.
        type: string
        default: main
      artifact-name:
        description: Build artifact name; use a unique value when calling multiple times in one run.
        type: string
        default: github-pages
      publish:
        description: Deploy successful source-branch builds to GitHub Pages; PRs only upload artifacts.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ["self-hosted", "high-performance"]
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout shared builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reusable workflow runs in the consumer's context, so select the builder explicitly.
          repository: rtCamp/wp-shared-workflows
          ref: ${{ inputs.tooling-ref }}
          path: shared-workflows
          sparse-checkout: tools/documentation
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: shared-workflows/tools/documentation/package-lock.json

      - name: Read GitHub Pages configuration
        id: pages
        if: inputs.publish && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install builder dependencies
        working-directory: shared-workflows/tools/documentation
        run: npm ci --no-fund

      - name: Configure site
        # Pass inputs as data rather than interpolating consumer values into executable JavaScript.
        env:
          SOURCE_DIRECTORY: ${{ inputs.source-directory }}
          DOCS_DIRECTORY: ${{ inputs.docs-directory }}
          SITE_TITLE: ${{ inputs.site-title }}
          SITE_CONFIG: ${{ inputs.site-config }}
          SITE_URL: ${{ inputs.site-url }}
          BASE_URL: ${{ inputs.base-url }}
          SIDEBAR: ${{ inputs.sidebar }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          const env = process.env;
          // Pages metadata handles custom domains; explicit URL inputs still take precedence.
          const pagesUrl = env.PAGES_BASE_URL ? new URL(env.PAGES_BASE_URL) : undefined;
          const settings = {
            sourceDirectory: env.SOURCE_DIRECTORY,
            docsDirectory: env.DOCS_DIRECTORY,
            sourceRef: env.SOURCE_REF,
            sourceRepository: env.SOURCE_REPOSITORY,
            title: env.SITE_TITLE,
            siteConfig: env.SITE_CONFIG,
            url: env.SITE_URL || pagesUrl?.origin,
            baseUrl: env.BASE_URL || (pagesUrl ? `${pagesUrl.pathname.replace(/\/$/, '')}/` : undefined),
            ...(env.SIDEBAR ? { sidebar: JSON.parse(env.SIDEBAR) } : {}),
          };
          writeFileSync(path.join(env.RUNNER_TEMP, 'docs-settings.json'), JSON.stringify(settings));
          JS

      - name: Build static documentation
        working-directory: shared-workflows/tools/documentation
        run: npm run build -- --source "$GITHUB_WORKSPACE/source" --settings "$RUNNER_TEMP/docs-settings.json"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ inputs.artifact-name }}
          path: shared-workflows/tools/documentation/build/
          include-hidden-files: true # Preserve .nojekyll.

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build
    if: >-
      inputs.publish &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'branch' &&
      github.ref_name == (inputs.source-branch || github.event.repository.default_branch)
    runs-on: ["self-hosted", "high-performance"]
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      # Hold this lock for both the freshness check and deployment to prevent out-of-order publishing.
      group: documentation-pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Skip superseded builds
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          # The runner must provide gh. An API failure stops the job rather than allowing deployment.
          latest=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits" -f sha="$SOURCE_BRANCH" -f per_page=1 --jq '.[0].sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment: the source branch has advanced.'
          fi

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ inputs.artifact-name }}
