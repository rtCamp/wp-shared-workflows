name: CD / Split Composer Packages

# Splits Composer-package subtrees out of a monorepo into standalone mirror
# repos (the Symfony "monorepo split" pattern), so Packagist can serve each
# package from its own repository.
#
#   * <config-file> (default splitsh.json) is the single source of truth for
#     mirror-repo name -> monorepo subdirectory. It lives in the CALLING
#     monorepo (e.g. wp-tooling), NOT in this repo: as a reusable workflow,
#     actions/checkout here pulls the caller's repository by default, so the
#     config is read from the caller's checkout at the triggering ref.
#   * build-matrix reads it once and emits a matrix.
#   * split runs splitsh-lite (via the danharrin action) per subtree, in
#     parallel, force-pushing each subtree to its mirror.
#
# To add/remove a package: edit the config file. No workflow change needed.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to push to the mirror repos. When empty, falls back to the ref that triggered the caller (github.ref_name)."
        type: string
        default: ""
      config-file:
        description: "Path to the splitsh config file, relative to the repo root."
        type: string
        default: "splitsh.json"
    secrets:
      split-token:
        description: "Token (fine-grained PAT or GitHub App token) with 'contents: write' on every mirror repo listed in the config file."
        required: true

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build split matrix from config
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      organization: ${{ steps.parse.outputs.organization }}
      branch: ${{ steps.parse.outputs.branch }}
      user_name: ${{ steps.parse.outputs.user_name }}
      user_email: ${{ steps.parse.outputs.user_email }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Parse config into a matrix
        id: parse
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "::error::Config file '$CONFIG_FILE' not found (path is relative to the repo root)."
            exit 1
          fi

          if ! jq empty "$CONFIG_FILE" 2>/dev/null; then
            echo "::error::Config file '$CONFIG_FILE' is not valid JSON."
            exit 1
          fi

          # Normalise both the shorthand string form ("composer-packages/foo")
          # and the object form ({ "prefixes": [{ "from": "..." }] }).
          if ! matrix=$(jq -c '{
            include: [
              (.subtrees // {}) | to_entries[] | {
                mirror_repo: .key,
                package_directory: (
                  if (.value | type) == "string" then .value
                  elif ((.value | type) == "object")
                       and ((.value.prefixes | type) == "array")
                       and ((.value.prefixes | length) > 0)
                       and ((.value.prefixes[0].from | type) == "string") then .value.prefixes[0].from
                  else error("invalid subtrees entry for \"" + .key + "\": expected a string path or { prefixes: [{ from: \"...\" }] }")
                  end
                )
              }
            ]
          }' "$CONFIG_FILE"); then
            echo "::error::Invalid 'subtrees' entry in '$CONFIG_FILE' — each value must be a string path or { prefixes: [{ from: \"...\" }] } (see jq error above)."
            exit 1
          fi

          count=$(jq -r '.include | length' <<<"$matrix")
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No subtrees defined in '$CONFIG_FILE'. Nothing to split."
            exit 1
          fi

          # Resolve the tag: explicit input wins, else the caller's ref name.
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="${{ github.ref_name }}"
          fi

          # `// empty` turns a missing/null key into an empty string instead
          # of the literal "null", so the presence check below actually works.
          organization=$(jq -r '.organization        // empty' "$CONFIG_FILE")
          branch=$(jq       -r '.defaults.branch     // empty' "$CONFIG_FILE")
          user_name=$(jq    -r '.defaults.user_name  // empty' "$CONFIG_FILE")
          user_email=$(jq   -r '.defaults.user_email // empty' "$CONFIG_FILE")

          if [[ -z "$organization" || -z "$branch" || -z "$user_name" || -z "$user_email" ]]; then
            echo "::error::Missing required keys in '$CONFIG_FILE' — organization, defaults.branch, defaults.user_name and defaults.user_email must all be set."
            exit 1
          fi

          {
            echo "matrix=$matrix"
            echo "organization=$organization"
            echo "branch=$branch"
            echo "user_name=$user_name"
            echo "user_email=$user_email"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Echo resolved matrix
        run: echo '${{ steps.parse.outputs.matrix }}' | jq .

  split:
    name: Split ${{ matrix.mirror_repo }}
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    steps:
      - name: Checkout monorepo (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # splitsh-lite needs every commit that ever touched the subtree.
          fetch-depth: 0

      - name: Split and push subtree to mirror
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893  # v2.4.5
        with:
          package_directory: ${{ matrix.package_directory }}
          repository_organization: ${{ needs.build-matrix.outputs.organization }}
          repository_name: ${{ matrix.mirror_repo }}
          branch: ${{ needs.build-matrix.outputs.branch }}
          tag: ${{ needs.build-matrix.outputs.tag }}
          user_name: ${{ needs.build-matrix.outputs.user_name }}
          user_email: ${{ needs.build-matrix.outputs.user_email }}
        env:
          GITHUB_TOKEN: ${{ secrets.split-token }}
