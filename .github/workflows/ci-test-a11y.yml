name: CI / Test a11y

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node.js version to install."
        type: string
        default: "22"
      build-command:
        description: "Shell command that produces the production build pa11y will test against."
        type: string
        default: "npm run build:prod"
      test-command:
        description: "Shell command that runs pa11y-ci."
        type: string
        default: "npm run test:a11y"
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test-a11y:
    name: pa11y-ci
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -eo pipefail -c "$BUILD_COMMAND"

      - name: Start wp-env
        run: npm run wp-env start

      - name: Run pa11y-ci
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -eo pipefail -c "$TEST_COMMAND"

      - name: Stop wp-env
        if: always()
        run: npm run wp-env stop
