name: CI / Lint PHP

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      php-version:
        description: "PHP version. Leave empty for 8.3."
        type: string
        default: ""
      enable-phpstan:
        description: "Run PHPStan after PHPCS."
        type: boolean
        default: false
      phpcs-command:
        description: "PHPCS binary path or custom command. It must forward its arguments to PHPCS. Leave empty for 'vendor/bin/phpcs'."
        type: string
        default: ""
      changed-files:
        description: "Newline-separated changed files (ci-detect-changes' php-files). PHP files that still exist are linted file by file; if the list is empty or holds anything else (composer.json, composer.lock, PHPStan config), PHPCS lints the whole project. PHPStan always runs whole-project — it analyses cross-file dependencies."
        type: string
        default: ""
      phpstan-command:
        description: "Shell command that runs PHPStan. It must forward its arguments to PHPStan. Leave empty for 'vendor/bin/phpstan analyse'."
        type: string
        default: ""
      phpstan-level:
        description: "Override PHPStan level. Empty uses the level from phpstan.neon.dist."
        type: string
        default: ""
      composer-flags:
        description: >-
          Flags passed to `composer install`. Leave empty for '--prefer-dist --optimize-autoloader
          --no-scripts'; pass your own flags to run Composer scripts.
        type: string
        default: ""
      validate-composer:
        description: "Run `composer validate` before installing. Disable for packages without composer.lock."
        type: boolean
        default: true
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # 2.37.0
        with:
          php-version: ${{ inputs.php-version || '8.3' }}
          tools: composer, cs2pr
          coverage: none
          # Raises the GitHub API rate limit when composer install resolves a VCS repo.
          github-token: ${{ github.token }}

      - name: Validate composer.json
        if: ${{ inputs.validate-composer }}
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        id: composer
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda  # 4.0.0
        with:
          working-directory: ${{ inputs.working-dir }}
          composer-options: ${{ inputs.composer-flags || '--prefer-dist --optimize-autoloader --no-scripts' }}

      - name: Resolve PHPStan tmpDir
        id: phpstan-tmp
        if: ${{ inputs.enable-phpstan }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$(vendor/bin/phpstan dump-parameters --json | jq -r '.tmpDir // empty')" || dir=""
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Per-run key so every run saves fresh results. The brackets stop one working-dir prefixing
      # another, and the composer.lock hash starts a clean cache when dependencies change.
      - name: Restore lint caches
        id: lint-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        env:
          KEY_PREFIX: lint-php-${{ runner.os }}-${{ inputs.php-version || '8.3' }}-[${{ inputs.working-dir }}]-${{ hashFiles(format('{0}/composer.lock', inputs.working-dir)) }}-
        with:
          path: |
            ${{ runner.temp }}/phpcs.cache
            ${{ steps.phpstan-tmp.outputs.dir }}
          key: ${{ env.KEY_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.KEY_PREFIX }}

      - name: Run PHPCS
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed-files }}
          PHPCS_COMMAND: ${{ inputs.phpcs-command || 'vendor/bin/phpcs' }}
        run: |
          set -euo pipefail
          # phpcs-command is a command and runs as shell; the report flags are appended as "$@" so
          # they stay argv. A repo-root basepath keeps annotation paths right in a monorepo.
          report="$RUNNER_TEMP/phpcs.xml"
          args=(-q --report-full "--report-checkstyle=$report" "--cache=$RUNNER_TEMP/phpcs.cache" "--basepath=$GITHUB_WORKSPACE")
          # php-files also lists composer.json, composer.lock and the PHPStan config, so a
          # dependency or config change re-runs this job, and it can name files the change
          # deleted. PHPCS only takes PHP files that exist; when anything else changed, a
          # dependency or ruleset change can affect every file, so lint the whole project.
          php_files=$(printf '%s\n' "$CHANGED_FILES" | grep -E '\.php$' \
            | while IFS= read -r file; do [ ! -f "$file" ] || printf '%s\n' "$file"; done || true)
          others=$(printf '%s\n' "$CHANGED_FILES" | grep -vE '^$|\.php$' || true)
          if [ -n "$php_files" ] && [ -z "$others" ]; then
            tmp_list=$(mktemp)
            trap 'rm -f "$tmp_list"' EXIT
            printf '%s\n' "$php_files" > "$tmp_list"
            args=(--file-list="$tmp_list" "${args[@]}")
          fi
          status=0
          bash -eo pipefail -c "$PHPCS_COMMAND \"\$@\"" _ "${args[@]}" || status=$?
          [ ! -s "$report" ] || cs2pr --graceful-warnings "$report"
          exit "$status"

      - name: Run PHPStan
        if: ${{ !cancelled() && inputs.enable-phpstan && steps.composer.outcome == 'success' }}
        shell: bash
        env:
          PHPSTAN_COMMAND: ${{ inputs.phpstan-command || 'vendor/bin/phpstan analyse' }}
          PHPSTAN_LEVEL: ${{ inputs.phpstan-level }}
        run: |
          set -eo pipefail
          args=(--error-format=checkstyle)
          [ -z "$PHPSTAN_LEVEL" ] || args+=("--level=$PHPSTAN_LEVEL")
          # PHPStan reports paths relative to working-dir, but annotations resolve from the repo root.
          root="$(cd "$GITHUB_WORKSPACE" && pwd -P)/"
          prefix="$(pwd -P)/"
          prefix="${prefix#"$root"}"
          case "$prefix" in /* | *[\|\&\\\<\>\"]*) prefix="" ;; esac
          bash -eo pipefail -c "$PHPSTAN_COMMAND \"\$@\"" _ "${args[@]}" \
            | sed "s|<file name=\"\([^/]\)|<file name=\"$prefix\1|" \
            | cs2pr --graceful-warnings

      - name: Save lint caches
        if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: |
            ${{ runner.temp }}/phpcs.cache
            ${{ steps.phpstan-tmp.outputs.dir }}
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}
