name: CI / Build Artifact Gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      gated-paths:
        description: "Newline-separated path prefixes whose contents must not be committed in a PR."
        type: string
        default: "assets/build/"
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  build-artifact-gate:
    name: Check gated paths
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect committed build artifacts
        shell: bash
        env:
          GATED_PATHS: ${{ inputs.gated-paths }}
          WORKING_DIR: ${{ inputs.working-dir }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_REF" ]]; then
            echo "::notice::Not a pull_request event (no base ref); skipping gate."
            exit 0
          fi

          PATTERN=$(printf '%s\n' "$GATED_PATHS" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' \
            | sed 's/[][\\.|^$()*+?{}]/\\&/g' \
            | paste -sd '|' -)

          if [[ -z "$PATTERN" ]]; then
            echo "::notice::No gated paths configured; skipping."
            exit 0
          fi

          # Normalise AND regex-escape: an unescaped "." matches any character, and a leading
          # "./" yields "^./themes/foo/" which matches nothing — silently passing the gate.
          DIR="${WORKING_DIR:-.}"
          DIR="${DIR#./}"
          DIR="${DIR%/}"
          [[ -n "$DIR" ]] || DIR="."
          if [[ "$DIR" != "." ]]; then
            DIR_RE=$(printf '%s' "$DIR" | sed 's/[][\\.|^$()*+?{}]/\\&/g')
            ANCHORED="^${DIR_RE}/(${PATTERN})"
          else
            ANCHORED="^(${PATTERN})"
          fi

          # Two parents alone prove nothing: pull_request_target checks out the base branch,
          # whose tip can be a merge commit too.
          HEAD_PARENT="$(git rev-parse -q --verify 'HEAD^2^{commit}' || true)"
          if [[ "$EVENT_NAME" != "pull_request" || "$GITHUB_REF" != refs/pull/*/merge ||
                -z "$PR_HEAD_SHA" || "$HEAD_PARENT" != "$PR_HEAD_SHA" ]]; then
            echo "::error::Not a pull_request merge checkout (event '${EVENT_NAME}', ref '${GITHUB_REF}'); no PR changes to check."
            exit 1
          fi
          BASE="$(git rev-parse --verify 'HEAD^1^{commit}')"

          echo "Comparing ${BASE_REF} (${BASE})..HEAD against pattern: ${ANCHORED}"

          DIFF="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)"
          # grep exits 1 when nothing matches.
          CHANGED="$(printf '%s\n' "$DIFF" | grep -E -- "${ANCHORED}" || [[ $? -eq 1 ]])"

          if [[ -n "$CHANGED" ]]; then
            echo "::error::Build artifacts must not be committed. Offending files:"
            printf '%s\n' "$CHANGED" | sed 's/^/  - /'
            echo
            echo "These paths are produced by CI on merge. Remove them from the PR"
            echo "(e.g. 'git rm --cached <file>') and ensure they are gitignored."
            exit 1
          fi

          echo "No committed build artifacts detected."
