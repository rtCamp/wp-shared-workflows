name: CI / Test JS

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      test-command:
        description: "Shell command that runs Jest."
        type: string
        default: "npm run test:js -- --ci"
      enable-cache:
        description: "Cache Jest transform/result data across runs."
        type: boolean
        default: true
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test-js:
    name: Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Resolve Jest cache directory
        id: jest-cache
        if: ${{ inputs.enable-cache }}
        run: echo "dir=$HOME/.jest-cache" >> "$GITHUB_OUTPUT"

      - name: Set up Jest cache
        if: ${{ inputs.enable-cache }}
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ${{ steps.jest-cache.outputs.dir }}
          key: jest-${{ runner.os }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run Jest
        run: ${{ inputs.test-command }}
        env:
          JEST_CACHE_DIRECTORY: ${{ steps.jest-cache.outputs.dir }}
