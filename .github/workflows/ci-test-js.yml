name: CI / Test JS

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node.js version. Leave empty to read .nvmrc from working-dir, then the repo root, falling back to 22."
        type: string
        default: ""
      test-command:
        description: >-
          Shell command that runs Jest. Leave empty for 'npm run test:js -- --ci'. When
          enable-cache is true, --cacheDirectory=<path> is appended as "$@", so a custom command
          must forward its arguments through to Jest — the default does, via npm's `--` separator.
        type: string
        default: ""
      enable-cache:
        description: "Cache Jest transform/result data across runs."
        type: boolean
        default: true
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test-js:
    name: Jest
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Node version: the input, else .nvmrc (working-dir, then repo root), else 22.
      - name: Resolve Node.js version
        id: node
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # setup-node reads the file path from the repo root.
          if [ -n "$NODE_VERSION" ]; then
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -s .nvmrc ]; then
            echo "file=$WORKING_DIR/.nvmrc" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Resolve Jest cache directory
        id: jest-cache
        if: ${{ inputs.enable-cache }}
        run: echo "dir=$HOME/.jest-cache" >> "$GITHUB_OUTPUT"

      - name: Set up Jest cache
        if: ${{ inputs.enable-cache }}
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ${{ steps.jest-cache.outputs.dir }}
          # Keyed on the lockfile: a bare 'jest-<os>' key is written once and never updated again,
          # so the cache would freeze at whatever the first run happened to produce.
          key: jest-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-dir)) }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Run Jest
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command || 'npm run test:js -- --ci' }}
          # Jest reads cacheDirectory from its config or --cacheDirectory only; there is no
          # environment variable for it, so the flag has to be appended to the command.
          JEST_CACHE_DIR: ${{ steps.jest-cache.outputs.dir }}
        run: |
          set -eo pipefail
          args=()
          [ -z "$JEST_CACHE_DIR" ] || args+=("--cacheDirectory=$JEST_CACHE_DIR")
          bash -eo pipefail -c "$TEST_COMMAND \"\$@\"" _ "${args[@]}"
