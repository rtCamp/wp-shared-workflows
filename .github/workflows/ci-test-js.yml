name: CI / Test JS

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node.js version. Leave empty to read .nvmrc from working-dir, then the repo root, falling back to 22."
        type: string
        default: ""
      test-runner:
        description: "JS test runner. Use jest or vitest. Leave empty for Jest."
        type: string
        default: ""
      test-command:
        description: >-
          Shell command that runs the tests. Leave empty for 'npm run test:js -- --ci' with Jest,
          or 'npm run test:js --' with Vitest. With Jest and enable-cache, --cacheDirectory=<path>
          is appended as "$@", so a custom command must forward its arguments through to Jest — the
          default does, via npm's `--` separator.
        type: string
        default: ""
      enable-cache:
        description: "Cache Jest transform/result data across runs. Ignored when test-runner is vitest."
        type: boolean
        default: true
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test-js:
    name: ${{ inputs.test-runner == 'vitest' && 'Vitest' || 'Jest' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve test runner
        id: runner
        shell: bash
        env:
          TEST_RUNNER: ${{ inputs.test-runner }}
        run: |
          set -euo pipefail
          case "${TEST_RUNNER:-jest}" in
            jest|vitest) echo "name=${TEST_RUNNER:-jest}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::test-runner must be jest or vitest (got '$TEST_RUNNER')"; exit 1 ;;
          esac

      # Node version: the input, else .nvmrc (working-dir, then repo root), else 22.
      - name: Resolve Node.js version
        id: node
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # setup-node reads the file path from the repo root.
          if [ -n "$NODE_VERSION" ]; then
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/$WORKING_DIR/.nvmrc" ]; then
            echo "file=$WORKING_DIR/.nvmrc" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Resolve Jest cache directory
        id: jest-cache
        if: ${{ inputs.enable-cache && steps.runner.outputs.name == 'jest' }}
        run: echo "dir=$HOME/.jest-cache" >> "$GITHUB_OUTPUT"

      - name: Set up Jest cache
        if: ${{ inputs.enable-cache && steps.runner.outputs.name == 'jest' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.jest-cache.outputs.dir }}
          # Keyed on the lockfile: a bare 'jest-<os>' key is written once and never updated again,
          # so the cache would freeze at whatever the first run happened to produce.
          key: jest-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-dir)) }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        env:
          TEST_RUNNER: ${{ steps.runner.outputs.name }}
          TEST_COMMAND: ${{ inputs.test-command }}
          # Jest reads cacheDirectory from its config or --cacheDirectory only; there is no
          # environment variable for it, so the flag has to be appended to the command.
          JEST_CACHE_DIR: ${{ steps.jest-cache.outputs.dir }}
        run: |
          set -eo pipefail
          args=()
          case "$TEST_RUNNER" in
            jest)
              TEST_COMMAND="${TEST_COMMAND:-npm run test:js -- --ci}"
              [ -z "$JEST_CACHE_DIR" ] || args+=("--cacheDirectory=$JEST_CACHE_DIR")
              ;;
            vitest)
              # Vitest has no --ci: it reads CI from the environment. The trailing -- makes npm
              # pass appended flags on to Vitest instead of reading them itself.
              TEST_COMMAND="${TEST_COMMAND:-npm run test:js --}"
              ;;
          esac
          bash -eo pipefail -c "$TEST_COMMAND \"\$@\"" _ "${args[@]}"
