name: CI / Test PHP

on:
  workflow_call:
    inputs:
      php-version:
        description: "PHP version. Installed on the host (used directly in standalone mode) and passed to wp-env as WP_ENV_PHP_VERSION so the container runs the same version."
        type: string
        default: "8.3"
      node-version:
        description: "Node.js version (used only when use-wp-env is true)."
        type: string
        default: "22"
      wp-version:
        description: "WordPress core version for wp-env, e.g. '6.8' (resolved as WordPress/WordPress#<version>). Empty uses the version from the consumer's .wp-env.json. Ignored when use-wp-env is false."
        type: string
        default: ""
      use-wp-env:
        description: "Start @wordpress/env before tests for WordPress integration runs."
        type: boolean
        default: true
      test-command:
        description: "Shell command that runs PHPUnit. When empty, defaults to 'npm run test:php' if use-wp-env is true, otherwise 'vendor/bin/phpunit'."
        type: string
        default: ""
      composer-flags:
        description: "Flags passed to composer install."
        type: string
        default: "--no-interaction --prefer-dist --no-progress --no-scripts"
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."
    secrets:
      packages-token:
        description: "Optional token with read access to private Composer source repos (e.g. rtCamp/wp-framework). Authenticates `composer install` on the host (via setup-php) and inside the wp-env container. Omit for projects with only public/Packagist deps."
        required: false

permissions:
  contents: read

jobs:
  test-php:
    name: PHPUnit
    runs-on: ubuntu-latest
    # Pin the wp-env container's PHP/WordPress core via env: (not $GITHUB_ENV, which is
    # newline-injectable) at job scope, so start/run/stop resolve the same environment.
    # An empty WP_ENV_CORE is ignored by wp-env (falls back to the consumer's .wp-env.json).
    env:
      WP_ENV_PHP_VERSION: ${{ inputs.use-wp-env && inputs.php-version || '' }}
      WP_ENV_CORE: ${{ (inputs.use-wp-env && inputs.wp-version != '') && format('WordPress/WordPress#{0}', inputs.wp-version) || '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # 2.37.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer
          # Authenticates the host `composer install` for private VCS deps. Falls back to
          # the default GITHUB_TOKEN (rate-limit help only) when no packages-token is given.
          github-token: ${{ secrets.packages-token || github.token }}

      - name: Set up Node.js
        if: ${{ inputs.use-wp-env }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install Composer dependencies
        run: composer install ${{ inputs.composer-flags }}

      - name: Install npm dependencies
        if: ${{ inputs.use-wp-env }}
        run: npm ci

      - name: Start wp-env
        if: ${{ inputs.use-wp-env }}
        run: npm run wp-env start

      # Configure Composer auth inside the container so the in-container `composer install`
      # (e.g. a pretest:php hook) can resolve private VCS deps. Secrets can't be used in
      # `if:`, so guard on the env var inside the script — a no-op when no token is set.
      - name: Configure Composer auth in wp-env
        if: ${{ inputs.use-wp-env }}
        env:
          PACKAGES_TOKEN: ${{ secrets.packages-token }}
        run: |
          if [ -n "$PACKAGES_TOKEN" ]; then
            npx wp-env run tests-cli -- composer config --global github-oauth.github.com "$PACKAGES_TOKEN"
          fi

      - name: Run PHPUnit
        run: ${{ inputs.test-command != '' && inputs.test-command || (inputs.use-wp-env && 'npm run test:php' || 'vendor/bin/phpunit') }}

      - name: Stop wp-env
        if: ${{ inputs.use-wp-env && always() }}
        run: npm run wp-env stop
