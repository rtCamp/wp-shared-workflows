name: CI / Lint CSS

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to install on the runner."
        type: string
        default: "22"
      lint-command:
        description: "Shell command that runs Stylelint. Must exit non-zero on lint failure."
        type: string
        default: "npm run lint:css"

permissions:
  contents: read

jobs:
  lint-css:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Stylelint
        run: ${{ inputs.lint-command }}
