name: CI / Lint CSS

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node.js version. Leave empty to read .nvmrc from working-dir, then the repo root, falling back to 22."
        type: string
        default: ""
      lint-command:
        description: "Shell command that lints the project's stylesheets, as developers run it locally. Leave empty for 'npm run lint:css'."
        type: string
        default: ""
      lint-files-command:
        description: >-
          Shell command that lints only the stylesheets passed to it as arguments, such as
          'npm run lint:css:files'. Set it to lint just the changed stylesheets; leave it empty to
          always run lint-command.
        type: string
        default: ""
      changed-files:
        description: >-
          Newline-separated changed files (ci-detect-changes' css-files). When lint-files-command is
          set and every path is a stylesheet that still exists, only those are linted. A removed
          stylesheet, package.json, package-lock.json or a Stylelint config or ignore file lints
          the whole project with lint-command.
        type: string
        default: ""
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint-css:
    name: Stylelint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Node version: the input, else .nvmrc (working-dir, then repo root), else 22.
      - name: Resolve Node.js version
        id: node
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # setup-node reads the file path from the repo root.
          if [ -n "$NODE_VERSION" ]; then
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/$WORKING_DIR/.nvmrc" ]; then
            echo "file=$WORKING_DIR/.nvmrc" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run Stylelint
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed-files }}
          LINT_COMMAND: ${{ inputs.lint-command || 'npm run lint:css' }}
          LINT_FILES_COMMAND: ${{ inputs.lint-files-command }}
        run: |
          set -euo pipefail

          # Anything but an existing stylesheet (a removed one, package.json, the lockfile, a
          # Stylelint config or ignore file) lints the whole project. "./" keeps -x.css a path.
          files=()
          full_lint_reason=""

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue

            if [[ ! -f "$file" ]]; then
              full_lint_reason="$file was removed"
              break
            fi

            if [[ ! "$file" =~ \.(css|scss)$ ]]; then
              full_lint_reason="$file changed"
              break
            fi

            files+=("./$file")
          done <<< "$CHANGED_FILES"

          if [[ -n "$LINT_FILES_COMMAND" && -z "$full_lint_reason" && ${#files[@]} -gt 0 ]]; then
            bash -eo pipefail -c "$LINT_FILES_COMMAND \"\$@\"" _ "${files[@]}"
          else
            if [[ -n "$full_lint_reason" ]]; then
              echo "::notice::Linting the whole project: $full_lint_reason."
            fi

            bash -eo pipefail -c "$LINT_COMMAND"
          fi
