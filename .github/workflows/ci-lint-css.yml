name: CI / Lint CSS

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for every job, as JSON: a label such as \"ubuntu-latest\" or a label list such as [\"self-hosted\"]. rtCamp private repos pass [\"self-hosted\"]."
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node.js version. Leave empty to read .nvmrc from working-dir, then the repo root, falling back to 22."
        type: string
        default: ""
      lint-command:
        description: >-
          Shell command that runs Stylelint. The changed files are appended as arguments, so a
          custom command must pass them on, as npm run does. Leave empty for 'npm run lint:css'.
        type: string
        default: ""
      changed-files:
        description: >-
          Newline-separated changed files (ci-detect-changes' css-files). Only stylesheets that
          still exist are linted, and a list of only deleted stylesheets skips Stylelint. No list,
          or a change to package.json or package-lock.json, lints the whole project.
        type: string
        default: ""
      working-dir:
        description: "Working directory for monorepos."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint-css:
    name: Stylelint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Node version: the input, else .nvmrc (working-dir, then repo root), else 22.
      - name: Resolve Node.js version
        id: node
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # setup-node reads the file path from the repo root.
          if [ -n "$NODE_VERSION" ]; then
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -s .nvmrc ]; then
            echo "file=$WORKING_DIR/.nvmrc" >> "$GITHUB_OUTPUT"
          elif [ -s "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
          # setup-node is a JS action: without this it looks for the lockfile at the repo root.
          cache-dependency-path: ${{ inputs.working-dir != '.' && format('{0}/package-lock.json', inputs.working-dir) || '' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run Stylelint
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed-files }}
          LINT_COMMAND: ${{ inputs.lint-command || 'npm run lint:css' }}
        run: |
          set -eo pipefail
          # Lint only the changed stylesheets that still exist; "./" keeps a name like -x.css a path.
          # No list, or a package.json/lockfile change, lints the whole project.
          stylesheets=$(printf '%s\n' "$CHANGED_FILES" | grep -E '\.s?css$' \
            | while IFS= read -r file; do [ ! -f "$file" ] || printf './%s\n' "$file"; done || true)
          others=$(printf '%s\n' "$CHANGED_FILES" | grep -vE '^$|\.s?css$' || true)
          files=()
          if [ -n "$CHANGED_FILES" ] && [ -z "$others" ]; then
            if [ -z "$stylesheets" ]; then
              echo "::notice::Nothing to lint: the changed stylesheets were deleted."
              exit 0
            fi
            mapfile -t files <<< "$stylesheets"
          fi
          bash -eo pipefail -c "$LINT_COMMAND \"\$@\"" _ "${files[@]}"
