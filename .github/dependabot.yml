version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Action pins run in callers' CI, so a bump reaches them only through a release. release-please
    # (release-please-config.json) bumps the patch version for fix and lists it under Fixed.
    # Retitle a major bump that raises a requirement (such as a newer runner) to feat before merging.
    commit-message:
      prefix: 'fix'
      include: 'scope'
    labels:
      - Dependencies
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
